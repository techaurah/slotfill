[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotfill"
version = "0.1.0"
description = "No-show recovery for appointment businesses: reminders and waitlist backfill on the calendar you already use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TechAurah" }]
keywords = ["appointments", "no-show", "reminders", "waitlist", "calendar", "scheduling"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slotfill = "slotfill.cli:main"

[project.urls]
Homepage = "https://techaurah.com"
Repository = "https://github.com/techaurah/slotfill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
