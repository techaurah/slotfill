<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="494" viewBox="0 0 1180 494" role="img" aria-label="Real SlotFill demo output: a cancellation is detected, reminders and offers go out, Ben Cole replies YES and is booked, and the other offers are stood down">
